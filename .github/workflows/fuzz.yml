name: fuzz

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pkg: ./internal/auth/oidc, target: FuzzDeriveUsername}
          - {pkg: ./internal/cube, target: FuzzRoundTrip}
          - {pkg: ./internal/cube, target: FuzzDecode}
          - {pkg: ./internal/cube, target: FuzzParseFilter}
          - {pkg: ./internal/export, target: FuzzCSV_NoFormulaCell}
          - {pkg: ./internal/fname, target: FuzzRoundTrip}
          - {pkg: ./internal/noderef, target: FuzzParse}
          - {pkg: ./internal/repo, target: FuzzScope}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make web-stub
      - run: go test -run='^$' -fuzz="^${FUZZ_TARGET}\$" -fuzztime=5m "${FUZZ_PKG}"
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_PKG: ${{ matrix.pkg }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-corpus-${{ strategy.job-index }}-${{ matrix.target }}
          path: '**/testdata/fuzz/**'
